"$schema" = "https://openapi.vercel.sh/vercel.json"

[services.web]
root = "app/frontend/"

[services.api]
root = "app/"
entrypoint = "backend.main:app"

# API routes first
[[rewrites]]
source = "/api/(.*)"
destination = { service = "api" }

[[rewrites]]
source = "/health"
destination = { service = "api" }

[[rewrites]]
source = "/docs"
destination = { service = "api" }

[[rewrites]]
source = "/docs/(.*)"
destination = { service = "api" }

[[rewrites]]
source = "/openapi.json"
destination = { service = "api" }

# Frontend fallback last
[[rewrites]]
source = "/(.*)"
destination = { service = "web" }
